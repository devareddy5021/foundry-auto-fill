<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foundry Auto-Filler & AI Evaluator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="title-group">
        <span class="icon">🤖</span>
        <h1>Foundry Evaluator</h1>
      </div>
      <span class="badge">v2.0</span>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="ai-tab">🤖 1-Click AI</button>
      <button class="tab-btn" data-tab="manual-tab">📋 Manual</button>
      <button class="tab-btn" data-tab="settings-tab">⚙️ Settings</button>
    </nav>

    <!-- TAB 1: 1-Click AI -->
    <div id="ai-tab" class="tab-pane active">
      <div class="ai-banner">
        <div class="ai-banner-title">Perit AI Rubric Compliant</div>
        <div class="ai-banner-desc">Scrapes turns, timestamps & prefilled traps, applies 1-sentence quoted justifications, and fills ratings.</div>
      </div>

      <button id="ai-eval-btn" class="btn btn-ai">
        <span class="btn-icon">⚡</span>
        <span>Auto-Evaluate & Fill with AI</span>
      </button>

      <div class="secondary-actions">
        <button id="fast-audio-btn" class="btn btn-secondary" title="Play at 4x to meet 90% audio rule">
          ▶️ Fast-Play Audio (4x)
        </button>
      </div>

      <div class="preview-toggle-row">
        <label class="checkbox-row">
          <input type="checkbox" id="ai-fill-just-cb" checked>
          <span>Fill Justifications</span>
        </label>
        <button id="toggle-preview-btn" class="link-btn">Show AI Output ▾</button>
      </div>

      <div id="ai-preview-box" class="preview-box hidden">
        <textarea id="ai-preview-text" readonly placeholder="AI evaluation results will appear here..."></textarea>
        <button id="copy-ai-preview-btn" class="btn btn-xs">Copy Output</button>
      </div>
    </div>

    <!-- TAB 2: Manual Paste -->
    <div id="manual-tab" class="tab-pane">
      <label for="answers-input" class="label">Paste Evaluation Text (TURN 1 to N):</label>
      <textarea id="answers-input" placeholder="TURN 1&#10;Content: 5/5&#10;Error Code: None&#10;Justification: The agent acknowledges...&#10;Prosody: 5/5..."></textarea>

      <div class="button-group">
        <button id="paste-btn" class="btn btn-secondary">📋 Paste Clipboard</button>
        <button id="clear-btn" class="btn btn-secondary">🗑 Clear</button>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="manual-fill-just-cb" checked>
        <span>Fill Justifications</span>
      </label>

      <button id="fill-btn" class="btn btn-primary">⚡ Fill Current Page</button>
    </div>

    <!-- TAB 3: Settings -->
    <div id="settings-tab" class="tab-pane">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <label class="label" for="api-key-input">Gemini API Key:</label>
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-btn" style="text-decoration:none;">Get Free Key ↗</a>
      </div>
      <div class="api-key-row">
        <input type="text" id="api-key-input" placeholder="Paste your Gemini API Key here">
        <button id="test-key-btn" class="btn btn-secondary btn-sm">Verify</button>
      </div>

      <label class="label" for="model-select" style="margin-top:10px;">Evaluation Model:</label>
      <select id="model-select" class="select-input">
        <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash Lite (Fastest & Free)</option>
        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
      </select>

      <div class="settings-divider"></div>

      <label class="checkbox-row">
        <input type="checkbox" id="show-floating-btn-checkbox">
        <span>Show bottom-right button on pages</span>
      </label>

      <button id="save-settings-btn" class="btn btn-secondary" style="width:100%; margin-top:12px;">
        💾 Save Settings
      </button>
    </div>

    <!-- Live Progress Console -->
    <div class="log-container">
      <div class="log-header">
        <span>Live Progress</span>
        <button id="clear-log-btn" class="link-btn">Clear</button>
      </div>
      <div id="log-output" class="log-output">Ready. Open your Foundry rating tab and click "Auto-Evaluate & Fill with AI".</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
